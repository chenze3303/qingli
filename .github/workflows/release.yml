name: Build Windows portable app

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run build:portable

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: qingli-windows-x64
          path: src-tauri/target/release/qingli.exe
          if-no-files-found: error

      - name: Refresh latest portable download
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: 最新开发版
          prerelease: true
          make_latest: false
          overwrite_files: true
          body: 自动从 main 分支构建。适合体验最新变更；稳定版本请下载带 v 版本号的 Release。
          files: src-tauri/target/release/qingli.exe

      - name: Publish versioned GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          files: src-tauri/target/release/qingli.exe
